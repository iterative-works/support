# PURPOSE: Configuration for the browser e2e suite (iw-support-e2e-testing framework)
# PURPOSE: The server hooks start the scenarios server in-process on the baseUrl port
baseUrl = "http://localhost:8392"
headless = true
# System Chrome: the downloaded chromium cannot resolve host libraries on nix-profile
# machines; override with PLAYWRIGHT_CHANNEL (or remove) where bundled chromium works
channel = "chrome"
channel = ${?PLAYWRIGHT_CHANNEL}
